# Tinyproxy forward proxy with CONNECT tunneling
# Filters HTTPS traffic by domain without decrypting it.

# Listen on port 3128 (matches HTTP_PROXY env vars in devcontainer.json)
Port 3128
Listen 127.0.0.1

# Run as nobody (tinyproxy default)
User nobody
Group nogroup

# Allow connections from localhost only
Allow 127.0.0.1
Allow ::1

# Allow CONNECT method on standard HTTPS port
ConnectPort 443

# Domain whitelist filter
Filter "/usr/local/etc/allowed-domains.txt"
FilterType fnmatch
FilterDefaultDeny Yes

# Logging
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Connect

# PID file
PidFile "/run/tinyproxy/tinyproxy.pid"

# Timeouts
Timeout 600
